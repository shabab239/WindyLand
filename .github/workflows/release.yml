name: release

# Builds a release from a version tag (v0.1.19 ...) on GitHub's servers, so
# the published installer is verifiably built from this repository's source.
# Once SignPath (free code signing for open source) is set up, the exe and the
# installer are signed here too; until then this produces an unsigned draft.
#
# SignPath setup (repository Settings > Secrets and variables > Actions):
#   secret   SIGNPATH_API_TOKEN          from SignPath, a CI user's API token
#   variable SIGNPATH_ORGANIZATION_ID    from SignPath
# Every signing request waits for a manual approval on signpath.io.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # No build cache for releases: always a clean build from source.
      - name: Build windyland.exe
        shell: pwsh
        run: .\build.ps1 -SkipInstaller -NoSelfTest

      - name: Self-test (informational)
        shell: pwsh
        continue-on-error: true
        run: |
          $env:WINDYLAND_DATA_DIR = "$env:RUNNER_TEMP\wl"
          $env:WINDYLAND_SELFTEST_OUT = "$env:RUNNER_TEMP\selftest.txt"
          Start-Process .\target\release\windyland.exe -ArgumentList '--selftest' -Wait
          Get-Content $env:WINDYLAND_SELFTEST_OUT | ForEach-Object { if ($_ -like 'FAIL*') { Write-Host "::warning::$_" } else { Write-Host $_ } }

      - name: Upload unsigned exe
        id: unsigned-exe
        uses: actions/upload-artifact@v4
        with:
          name: windyland-exe-unsigned
          path: target/release/windyland.exe

      - name: Sign windyland.exe (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: WindyLand
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed-exe

      - name: Use the signed exe
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item signed-exe\windyland.exe target\release\windyland.exe -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: .\build.ps1 -InstallerOnly

      - name: Upload unsigned installer
        id: unsigned-setup
        uses: actions/upload-artifact@v4
        with:
          name: windyland-setup-unsigned
          path: dist/WindyLandSetup-*.exe

      - name: Sign the installer (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: WindyLand
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed-setup

      - name: Pick the installer to publish
        id: pick
        shell: pwsh
        run: |
          $dir = if ($env:SIGN -eq 'true') { 'signed-setup' } else { 'dist' }
          $f = Get-ChildItem "$dir\WindyLandSetup-*.exe" | Select-Object -First 1
          $sha = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "$($f.Name) sha256 $sha"
          "file=$($f.FullName)" >> $env:GITHUB_OUTPUT

      # A draft: check it, add notes, then press Publish on GitHub.
      - name: Draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ steps.pick.outputs.file }}
